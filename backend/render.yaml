services:
  - type: web
    name: locallink-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /auth/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_SYNC
        value: "true"
      - key: DATABASE_SSL
        value: "true"
      # Set these in Render dashboard (do not hardcode secrets):
      # DATABASE_URL
      # JWT_SECRET
      # CORS_ORIGIN        → https://your-vercel-app.vercel.app
      # GMAIL_CLIENT_ID
      # GMAIL_CLIENT_SECRET
      # GMAIL_REFRESH_TOKEN
      # GMAIL_USER
      # GOOGLE_CLIENT_ID
      # GOOGLE_CLIENT_SECRET
      # GOOGLE_CALLBACK_URL → https://locallink-rg79.onrender.com/auth/google/callback
      # SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASS / SMTP_FROM (if using SMTP fallback)
